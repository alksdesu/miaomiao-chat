<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Network Monitor</title>
        <link rel="stylesheet" href="style.css" />
        <style>
            body {
                margin: 0;
                padding: 0;
                background: var(--bg-primary);
                color: var(--text-primary);
                height: 100vh;
                overflow: hidden;
            }
            .network-panel {
                position: static;
                width: 100%;
                height: 100vh;
                display: flex;
            }
            .network-panel.open {
                display: flex;
            }
            .network-resize-handle {
                display: none;
            }
            .network-toolbar {
                -webkit-app-region: drag;
            }
            .network-toolbar button,
            .network-toolbar select {
                -webkit-app-region: no-drag;
            }
        </style>
    </head>
    <body>
        <script type="module">
            import { setReplicaMode } from './js/network/store.js';
            import { openNetworkPanel } from './js/network/panel.js';

            // 从主窗口继承主题
            if (window.opener) {
                const openerClasses = window.opener.document.body.className;
                if (openerClasses.includes('dark-theme')) {
                    document.body.classList.add('dark-theme');
                }
                const openerTheme = window.opener.document.documentElement.className;
                if (openerTheme.includes('dark-theme')) {
                    document.documentElement.classList.add('dark-theme');
                }
            }

            setReplicaMode(true);
            openNetworkPanel();

            const channel = new BroadcastChannel('network-panel-control');
            channel.onmessage = (e) => {
                if (e.data?.type === 'dock') window.close();
                if (e.data?.type === 'theme-change') {
                    document.body.className = e.data.bodyClass || '';
                    document.documentElement.className = e.data.htmlClass || '';
                }
            };

            window.addEventListener('beforeunload', () => {
                channel.postMessage({ type: 'undocked-window-closed' });
            });
        </script>
    </body>
</html>
